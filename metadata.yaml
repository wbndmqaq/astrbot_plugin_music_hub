name: astrbot_plugin_music_hub
desc: |
  Music Hub —— QQ / 酷狗 / 网易云三平台聚合点歌。

  点歌（三平台混搜、同名合并多音源、失败自动换源）、歌词（含 KRC/QRC 逐字）、评论、
  排行榜与歌单等发现类指令、点歌台队列、订阅推送、聊天或 WebUI 扫码登录、LLM 函数
  工具点歌。WebUI 管理面板：多音源搜索试听、投递到群、调用统计、黑白名单、全量配置、
  运行日志。完整指令与说明见仓库 README。

  依赖：QQ 音乐内置 qqmusic-api-python，开箱即用；网易云 / 酷狗各需一个 HTTP API
  服务，默认地址已预填（公共实例 / 本机自建），见 README「三音源接入」。
