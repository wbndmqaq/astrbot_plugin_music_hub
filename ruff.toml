line-length = 110
target-version = "py310"

# 审计报告等非源码文件不进 lint/format 扫描面
exclude = ["AUDIT_REPORT_*.md"]

[lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",  # 行长由 formatter 管理，中文注释普遍偏长
]

[lint.per-file-ignores]
"_probe_*.py" = ["E402", "F401"]
"main.py" = ["E402"]
"tests/conftest.py" = ["E402"]

[format]
quote-style = "double"
